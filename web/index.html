<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Invoice Desk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>
    <main class="shell">
      <header class="brand-block">
        <p class="brand">Invoice Desk</p>
        <h1>Create a clinic invoice, then set its date.</h1>
        <p class="lede">
          Search the patient by national ID, choose clinic and service, enter the
          amount paid, and run create-and-backdate.
        </p>
      </header>

      <section class="workspace" aria-label="Invoice form">
        <form id="invoice-form" class="invoice-form">
          <div class="meta-row" id="meta-row">
            <span class="meta-chip" id="meta-patient">Patient —</span>
            <span class="meta-chip quiet" id="meta-user">Signed in as —</span>
          </div>

          <div class="nid-row">
            <label class="field grow">
              <span>National ID</span>
              <input
                id="national-id"
                name="national_id"
                type="text"
                inputmode="numeric"
                placeholder="e.g. 2576425918"
                required
              />
            </label>
            <button id="find-patient" type="button" class="secondary">
              Find patient
            </button>
          </div>

          <label class="field">
            <span>Clinic</span>
            <select id="clinic" name="clinic" required disabled>
              <option value="">Loading clinics…</option>
            </select>
          </label>

          <label class="field">
            <span>Service</span>
            <select id="service" name="service" required disabled>
              <option value="">Select a clinic first</option>
            </select>
          </label>

          <div class="split">
            <label class="field">
              <span>Amount paid</span>
              <input
                id="amount"
                name="amount"
                type="number"
                min="0"
                step="0.01"
                placeholder="0.00"
                required
              />
            </label>

            <label class="field">
              <span>Invoice date</span>
              <input id="date" name="date" type="date" required />
            </label>
          </div>

          <label class="check">
            <input id="headed" type="checkbox" />
            <span>Show browser while running</span>
          </label>

          <button id="submit" type="submit" class="primary" disabled>
            Create invoice
          </button>
        </form>

        <aside class="status-panel" aria-live="polite">
          <div class="status-head">
            <h2>Status</h2>
            <span id="status-pill" class="pill">Idle</span>
          </div>
          <ol id="log" class="log">
            <li class="muted">Enter a national ID and find the patient.</li>
          </ol>
          <div id="result" class="result hidden"></div>
        </aside>
      </section>
    </main>
    <script src="/static/app.js" type="module"></script>
  </body>
</html>
